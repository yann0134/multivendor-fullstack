spring.application.name=mcp-client

# ========================================
# Configuration du serveur
# ========================================
server.port=8866

# ========================================
# Configuration MCP Client
# ========================================
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.enabled=true

# Connexion au serveur MCP (SSE)
spring.ai.mcp.client.sse.connections.server1.url=http://localhost:3026
spring.ai.mcp.client.sse.connections.server1.sse-endpoint=/sse

# Connexion au serveur MCP (STDIO - Filesystem)
#spring.ai.mcp.client.stdio.servers-configuration=classpath:mcp-server.json

# ========================================
# Configuration Ollama
# ========================================
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.1:latest
spring.ai.ollama.chat.options.temperature=0.3
spring.ai.ollama.chat.options.num-predict=2000

# Activer explicitement les function calls
# spring.ai.ollama.chat.options.format=json

# ========================================
# Configuration Swagger/OpenAPI
# ========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method

# ========================================
# Logs pour debugging (a desactiver en prod)
# ========================================
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.ai.chat=DEBUG
logging.level.org.springframework.ai.tool=DEBUG
logging.level.org.example.mcpclient=DEBUG
logging.level.io.modelcontextprotocol=DEBUG

# ========================================
# Configuration JPA (si vous utilisez une base de donnees)
# ========================================
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none