# Administrateur par défaut (créé au démarrage si absent)
app.admin.email=admin@agrimarket.local
app.admin.password=ChangeMe123!
app.admin.full-name=Super Admin
spring.application.name=multivendor

server.port = 3026

# Désactiver le redémarrage automatique
spring.devtools.restart.enabled=false

# Configuration MySQL pour la production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.url=jdbc:mysql://51.195.11.202:3308/ecom_multivendor?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=10&connectTimeout=30000&socketTimeout=60000&useServerPrepStmts=false&rewriteBatchedStatements=true&cachePrepStmts=true&useLocalSessionState=true&elideSetAutoCommits=true&maintainTimeStats=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration HikariCP optimisée pour connexions distantes
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=10000
spring.datasource.hikari.leak-detection-threshold=120000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=MultivendorHikariCP
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.isolate-internal-queries=false
spring.datasource.hikari.allow-pool-suspension=false
spring.datasource.hikari.read-only=false
spring.datasource.hikari.register-mbeans=false

