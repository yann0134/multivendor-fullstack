# =============================================================================
# CONFIGURATION GENERALE DE L'APPLICATION
# =============================================================================
spring.application.name=multivendor
server.port=3026

# Desactiver au demarrage automatique
spring.devtools.restart.enabled=false

# =============================================================================
# CONFIGURATION SPRING AI MCP SERVER
# =============================================================================
# Configuration principale du serveur MCP
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=spring-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC

# Instructions du serveur MCP
spring.ai.mcp.server.instructions=This server provides e-commerce multivendor tools for product management, cart operations, meal planning, recipe management, and order processing. It enables AI assistants to interact with the multivendor platform to search products, manage shopping carts, create meal plans, browse recipes, and process orders.

# Configuration des outils disponibles - PACKAGES CORRECTS
spring.ai.mcp.server.tools.enabled=true
# Scanner TOUS les packages qui contiennent des @Tool
spring.ai.mcp.server.tools.packages=com.camoutech.multivendor.chat,

# Endpoints pour la communication MCP
spring.ai.mcp.server.sse-endpoint=/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/message

# Notifications de changement
spring.ai.mcp.server.prompt-change-notification=true
spring.ai.mcp.server.tool-change-notification=true
spring.ai.mcp.server.resource-change-notification=true

# Capabilities
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=true
spring.ai.mcp.server.capabilities.prompt=true
spring.ai.mcp.server.capabilities.completion=true

# Seloppement
spring.ai.mcp.server.security.enabled=false
spring.ai.mcp.server.security.require-auth=false

# =============================================================================
# CONFIGURATION DE LA BASE DE DONNEES
# =============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.url=jdbc:mysql://localhost:3306/ecom_multivendor?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=10&connectTimeout=30000&socketTimeout=60000&useServerPrepStmts=false&rewriteBatchedStatements=true&cachePrepStmts=true&useLocalSessionState=true&elideSetAutoCommits=true&maintainTimeStats=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration HikariCP optimise
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=10000
spring.datasource.hikari.leak-detection-threshold=120000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=MultivendorHikariCP
spring.datasource.hikari.keepalive-time=30000

# =============================================================================
# CONFIGURATION ADMINISTRATEUR PAR DEFAUT
# =============================================================================
app.admin.email=admin@agrimarket.local
app.admin.password=ChangeMe123!
app.admin.full-name=Super Admin

# =============================================================================
# CONFIGURATION DES UPLOADS
# =============================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB
app.upload.path=uploads
app.upload.max-size=5242880

# =============================================================================
# CONFIGURATION EMAIL
# =============================================================================
spring.mail.enabled=false

# =============================================================================
# LOGS POUR DEBUGGING
# =============================================================================
logging.level.org.springframework.ai.mcp=DEBUG
logging.level.io.modelcontextprotocol=DEBUG
logging.level.org.springframework.web=INFO
logging.level.com.camoutech.multivendor=DEBUG